<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Discharged in MJ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 20px; font-family: Arial, Helvetica, sans-serif;
    background: #fff; color: #111;
  }
  main { text-align: center; }
  h1 { margin: 0 0 18px; font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 600; }
  #value { font-size: clamp(2.8rem, 10vw, 5rem); font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Energy Discharged in MJ</h1>
  <div id="value" aria-live="polite">—</div>
</main>
<script>
(() => {
  const output = document.getElementById('value');
  
  // Set your actual fixed start date/time (Year, Month [0-indexed], Day, Hour, Min, Sec)
  // Note: Month is 0-indexed (0 = Jan, 10 = Nov, etc.)
  const startDate = new Date(2026, 09, 27, 11, 0, 0); 

  function update() {
    const now = new Date();
    const elapsedMinutes = (now - startDate) / 60000;
    const capacity = elapsedMinutes * 2.8 * 60 * 0.001;
    
    output.textContent = capacity.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }
  
  update();
  setInterval(update, 1000);
})();
</script>
</body>
</html>
